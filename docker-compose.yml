version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartcity360_postgres
    restart: always
    environment:
      POSTGRES_USER: smartcity_admin
      POSTGRES_PASSWORD: smartcity_secure_pass
      POSTGRES_DB: smartcity360_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcity_admin -d smartcity360_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smartcity360_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: smartcity360_backend
    restart: always
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://smartcity_admin:smartcity_secure_pass@postgres:5432/smartcity360_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=smartcity360-super-secret-key-change-in-prod-32-chars
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: smartcity360_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
