[project]
name = "smartcity360-backend"
version = "0.1.0"
description = "SmartCity360 Enterprise Municipal Backend Engine"
readme = "../README.md"
requires-python = ">=3.12"
authors = [
    { name = "SmartCity360 Architecture Team", email = "engineering@smartcity360.local" }
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = [
    "tests",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
