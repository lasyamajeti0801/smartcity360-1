name: SmartCity360 Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  audit-and-quality-gate:
    name: Codebase Audit & Security Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Secret and Security Audit
        run: |
          python scripts/security_audit.py

      - name: Run LOC and Quality Audit
        run: |
          python scripts/project_audit.py

  backend-ci:
    name: Backend Test & Typecheck
    runs-on: ubuntu-latest
    needs: audit-and-quality-gate
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Test Suite
        run: |
          pytest backend/tests -v --durations=10

  frontend-ci:
    name: Frontend Test & Typecheck
    runs-on: ubuntu-latest
    needs: audit-and-quality-gate
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Typecheck & Build
        working-directory: frontend
        run: |
          npm run build
